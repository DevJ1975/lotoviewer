name: Repo health

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository guards
        run: npm run check:repo

      - name: Run wiki sync
        if: github.event_name == 'pull_request'
        env:
          WIKI_SYNC_BASE: origin/${{ github.base_ref }}
        run: npm run check:wiki

  # Executes application code, which the `checks` job above deliberately does
  # not.
  #
  # This used to run only `test:security` — a 28-file subset of the auth
  # surface — because `npm test` was believed to have ~127 pre-existing
  # failures. That is no longer true, and the two records of it disagreed with
  # each other (this comment said 127, todos.md said 81). Measured on main:
  # the full suite is 329 files / 4092 tests / 0 failures, and `tsc --noEmit`
  # is clean for apps/web. So the gate is widened to the whole suite, which
  # subsumes the old security subset — `npm run test:security` is kept as a
  # script for fast local runs, not as a separate CI job.
  #
  # Lint is the one gate that genuinely cannot block yet: `eslint .` reports
  # 82 errors and 70 warnings, concentrated in the React Compiler rules
  # (preserve-manual-memoization 26, no-unescaped-entities 20, refs 19,
  # purity 10). It runs here for visibility and is expected to fail until
  # those are repaired; flip continue-on-error off in the PR that fixes them.
  #
  # One job rather than three so `npm ci` runs once. Typecheck goes first: it
  # is the fastest way to fail a broken PR.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # SENTRYCLI_SKIP_DOWNLOAD: @sentry/cli's postinstall fetches a binary
      # from downloads.sentry-cdn.com. It is only needed for build-time
      # source-map upload, never for tests, and the fetch is a hard install
      # failure on a restricted network.
      #
      # This used to be followed by a step that hand-installed
      # @rolldown/binding-linux-x64-gnu, because package-lock.json was
      # generated on macOS and recorded only the darwin binding, leaving
      # vitest unable to start on Linux. apps/web now declares the Linux
      # binding as a devDependency — the same fix already used for
      # @tailwindcss/oxide-linux-x64-gnu — so `npm ci` installs it directly.
      # The pin is exact and must track rolldown's own version (both
      # 1.0.0-rc.17 today); if a dependency bump moves rolldown, bump this
      # with it or vitest will fail to load its native binding.
      - name: Install dependencies
        run: SENTRYCLI_SKIP_DOWNLOAD=1 npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the web test suite
        run: npm test

      - name: Run the core package test suite
        run: npm run test:core

      # Expected red — see the note above. Visibility only until the 82
      # pre-existing errors are repaired.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

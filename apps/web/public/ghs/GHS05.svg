<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GHS05 — Corrosive">
  <title>GHS05 — Corrosive</title>
  <path d="M32 3 L61 32 L32 61 L3 32 Z" fill="#fff" stroke="#E30613" stroke-width="3" stroke-linejoin="miter"/>
  <!-- LEFT: tube pouring onto a flat metal surface that is corroding -->
  <path d="M9 14 L20 18 L16 29 L5 25 Z" fill="#000"/>
  <path d="M13 30 C 14 34 14 37 15 41" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>

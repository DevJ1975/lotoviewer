  <path d="M51 30 C 50 34 50 37 49 41" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
  <!-- stylised hand, back-of-hand with four fingers -->
  <path d="M36 56 L36 47
           C 36 45 38.5 45 38.5 47 L 38.5 43
           C 38.5 41 41 41 41 43 L 41 44
           C 41 42 43.5 42 43.5 44 L 43.5 46
           C 43.5 44 46 44 46 46 L 46 47
           L 49 45 C 51 44 52.5 46 51 48
           L 46 54 L 46 56 Z" fill="#000"/>
  <!-- corrosion drip-marks etching the hand -->
  <path d="M40 50 L41 54 M43.5 50 L44.5 53" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
</svg>

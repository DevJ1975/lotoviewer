  <path d="M5 43 L26 43 L26 46 L19 46 L17 49 L13 46 L5 46 Z" fill="#000"/>
  <path d="M8 47 L9 51 M13 49 L14 52 M19 47 L20 51 M23 47 L23 50" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
  <!-- RIGHT: tube pouring onto a hand that is corroding -->

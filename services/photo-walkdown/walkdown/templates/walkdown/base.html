{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#214488">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}Photo Walkdown{% endblock %} · Soteria Field</title>
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" href="{% static 'walkdown/icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'walkdown/icons/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'walkdown/walkdown.css' %}">
</head>
<body>
  <header class="bar">
    {% block back %}<a class="bar-title" href="{% url 'departments' %}">Photo Walkdown</a>{% endblock %}
    <span id="net-state" class="net" data-online-text="Online" data-offline-text="Offline"></span>
    {% if user.is_authenticated %}
    <a class="bar-link" href="{% url 'sync' %}">Sync <span id="queue-count" class="badge" hidden>0</span></a>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div id="update-banner" class="banner" hidden>
    A new version is ready. <button type="button" id="update-reload" class="btn small">Refresh</button>
  </div>
  <script src="{% static 'walkdown/htmx-2.0.10.min.js' %}"></script>
  <script src="{% static 'walkdown/queue.js' %}"></script>
  <script src="{% static 'walkdown/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

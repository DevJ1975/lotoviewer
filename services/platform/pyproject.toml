[project]
name = "soteria-platform"
version = "0.1.0"
description = "Django platform service for Soteria Field: workers, AI pipelines, read models and the internal ops admin. Runs alongside Supabase."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.12,<1",
    "sentry-sdk[django]>=2.20,<3",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.9",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by `makemigrations`; reviewed, not hand-styled.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
# Unmanaged models mirror Supabase columns as they are; nullable text columns
# must be null=True or reads of NULL rows would misrepresent the data.
"tenancy/models.py" = ["DJ001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^tests/", "/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
